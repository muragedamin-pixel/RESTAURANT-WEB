<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waiter — REAL Restaurant Staff</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Cinzel:wght@400;700&family=Lato:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="staff.css" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="dashboard-body">

  <nav class="staff-nav">
    <div class="nav-logo">REAL RESTAURANT</div>
    <div class="nav-role waiter">🍽️ Waiter</div>
    <div class="nav-links-staff">
      <a href="staff-kitchen.html">Kitchen</a>
      <a href="staff-waiter.html" class="active">Waiter</a>
      <a href="staff-manager.html">Manager</a>
      <a href="staff.html">← Portal</a>
    </div>
    <div class="nav-clock" id="clock"></div>
  </nav>

  <main class="dashboard-main">

    <div class="stats-bar">
      <div class="stat-pill"><span class="stat-num" id="stat-total-orders">0</span><span class="stat-label">All Orders</span></div>
      <div class="stat-pill warning"><span class="stat-num" id="stat-new-orders">0</span><span class="stat-label">New</span></div>
      <div class="stat-pill warning"><span class="stat-num" id="stat-preparing">0</span><span class="stat-label">Preparing</span></div>
      <div class="stat-pill success"><span class="stat-num" id="stat-ready">0</span><span class="stat-label">Ready to Serve</span></div>
      <div class="stat-pill muted"><span class="stat-num" id="stat-delivered">0</span><span class="stat-label">Served Today</span></div>
      <div class="stat-pill"><span class="stat-num" id="stat-tables">0</span><span class="stat-label">Table Bookings</span></div>
      <div class="stat-pill warning"><span class="stat-num" id="stat-pending-tables">0</span><span class="stat-label">Pending Confirmations</span></div>
    </div>

    <!-- All Orders — full list with status tabs -->
    <section class="manager-section" style="margin-bottom:1.5rem;">
      <div class="section-title-bar">
        <h2>🧾 All Orders</h2>
        <div style="display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;">
          <div class="filter-tabs">
            <button class="ftab active" onclick="waiterFilterOrders('all',this)">All</button>
            <button class="ftab" onclick="waiterFilterOrders('received',this)">New</button>
            <button class="ftab" onclick="waiterFilterOrders('preparing',this)">Preparing</button>
            <button class="ftab" onclick="waiterFilterOrders('ready',this)">Ready</button>
            <button class="ftab" onclick="waiterFilterOrders('delivered',this)">Delivered</button>
          </div>
          <button class="refresh-btn" onclick="refreshAll()">↺ Refresh</button>
        </div>
      </div>
      <div class="order-list" id="waiter-all-orders"></div>
    </section>

    <div class="waiter-grid">
      <!-- Ready to Deliver — quick action panel -->
      <section class="waiter-section">
        <div class="section-title-bar">
          <h2>✅ Ready to Deliver</h2>
        </div>
        <div class="order-list" id="ready-orders"></div>
      </section>

      <!-- Table Bookings -->
      <section class="waiter-section">
        <div class="section-title-bar">
          <h2>📋 Table Bookings</h2>
          <div class="filter-tabs">
            <button class="ftab active" onclick="filterBookings('all', this)">All</button>
            <button class="ftab" onclick="filterBookings('pending', this)">Pending</button>
            <button class="ftab" onclick="filterBookings('confirmed', this)">Confirmed</button>
          </div>
        </div>
        <div class="booking-list" id="table-bookings"></div>
      </section>
    </div>

  </main>

  <script src="auth-guard.js"></script>
  <script src="staff.js"></script>
  <script>
    guardPage(['waiter']).then(ok => { if (ok) initDashboard('waiter'); });
  </script>
</body>
</html>
